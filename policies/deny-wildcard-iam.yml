metadata:
  id: CUSTOM_AWS_004
  name: "Ensure IAM policies do not allow wildcard access"
  category: "IAM_SECURITY"

definition:
  and:
    - cond_type: attribute
      resource_types:
        - aws_iam_policy
      attribute: policy.Statement[0].Action
      operator: not_equals
      value: "*"

    - cond_type: attribute
      resource_types:
        - aws_iam_policy
      attribute: policy.Statement[0].Resource
      operator: not_equals
      value: "*"
